# Commons browser tests (T5.1; WebKit lane R0): runs the stubbed Playwright suite on every PR that
# touches commons/ or the tests. Never touches the live backend (all RPC + Auth
# calls are stubbed; the real-backend smoke test stays manual — it needs a code).
#
# ci-shard (2026-11-25): each lane is split into parallel shards (Chromium 2, WebKit 3) so a run takes
# ~5 min instead of ~13. One summary job per lane keeps the check names `e2e` and `e2e-webkit`
# (merge-check looks for them by name) and is green only when every shard of its lane passed.
# WebKit is no longer continue-on-error: a WebKit failure shows red (Zeeshan, 2026-11-25).
name: Commons e2e

on:
  pull_request:
    paths:
      - "commons/**"
      - "tests/e2e/**"
      - ".github/workflows/commons-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run still going for the older commit.
concurrency:
  group: commons-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # let every shard finish, so a red run shows all its failures
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # runs PR code and never pushes: keep the token out of the runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Install Playwright (pinned in package-lock.json)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run this shard (Chromium project)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}  # total comes from the matrix: no count to drift
        run: npx playwright test --project=mobile --shard="$SHARD"
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: tests/e2e/test-results
          retention-days: 7

  e2e:
    name: e2e
    needs: e2e-shard
    if: always()  # must run (and fail) when a shard failed, was cancelled or was skipped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Chromium shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "Chromium shards: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::a Chromium shard did not pass ($RESULT)"; exit 1; }

  # WebKit = the iPhone engine (R0). Same posture as the Chromium lane: pull_request only,
  # contents: read, no secrets.
  e2e-webkit-shard:
    name: e2e-webkit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # a shard's tests take ~4 min; the margin covers a slow WebKit install (one took 15 min on 2026-11-24)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # runs PR code and never pushes: keep the token out of the runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Install Playwright (pinned in package-lock.json)
        run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run this shard (WebKit project)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npx playwright test --project=webkit --shard="$SHARD"
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-webkit-results-${{ matrix.shard }}
          path: tests/e2e/test-results
          retention-days: 7

  e2e-webkit:
    name: e2e-webkit
    needs: e2e-webkit-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every WebKit shard passed
        env:
          RESULT: ${{ needs.e2e-webkit-shard.result }}
        run: |
          echo "WebKit shards: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::a WebKit shard did not pass ($RESULT)"; exit 1; }
