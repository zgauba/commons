# Repo rules (harness-autonomy-plan B1, 2026-11-23): the CLAUDE.md rules a script can check — Supabase project
# separation (R1–R3), personal-page wording and no phone number (R4–R6), credit links (R7), "football" (R8), and no
# sleeps, skips or retries on the test lines the PR adds (R9: reads base...head, so the PR checkout has full history).
# The same script runs locally before Claude may finish a session (.claude/verify.sh).
# Runs on pull_request_target, like the other gates: this file and the script come from the base branch, so a PR
# can't weaken the check it must pass. The PR is checked out as data in ./pr and only read, never run.
# A PR that changes tests/ci/repo-rules*.mjs is checked by the old script; its new version runs once merged.
# No path filter on purpose: a required check must report on every PR, or GitHub waits on it forever.
name: Repo rules

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the rule script, from the base branch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: tests/ci
          persist-credentials: false
      # the PR, as data only, in its own folder: nothing is copied over it and nothing from it runs (git only reads it)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Rule tests
        run: node --test base/tests/ci/repo-rules.test.mjs
      - name: Check the PR against R1–R9
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          FILES: ${{ github.event.pull_request.changed_files }}
        run: node base/tests/ci/repo-rules.mjs --root pr --base "$BASE" --expect-files "$FILES"
