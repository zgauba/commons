# Design guard (DS-5 E3 + E4, 2026-11-19): module CSS may not style bare select / input / textarea / label /
# button, and the same rule body may not be copied into a second CSS file (docs/design.md §8 #1–#2).
# Today's offenders: tests/ci/design-guard-baseline.txt — it may only shrink, checked against the base branch's copy.
# Runs on pull_request_target (harness-autonomy-plan PR 3a, 2026-11-23): this file and the guard's code come from the
# base branch, so a PR can't weaken the check it must pass. The PR's files (CSS + its baseline) are only read, never run.
# A PR that changes tests/ci/design-guard*.mjs is checked by the old guard; its new version runs once merged.
# It checks the PR branch itself (head), not a merge with main: if main lowered the baseline since the PR branched,
# the guard reports "the baseline grew" — merge main into the PR branch and it clears.
# No path filter on purpose: a required check must report on every PR, or GitHub waits on it forever.
name: Design guard

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  design-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the guard's code and baseline, from the base branch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: tests/ci
          persist-credentials: false
      # the PR, as data only, in its own folder: nothing is copied over it and nothing from it runs (security review 2026-11-23)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Guard tests
        run: node --test base/tests/ci/design-guard.test.mjs
      # the PR's baseline may lower counts, never add or raise one, checked against the base branch's
      - name: Check the PR's Commons CSS against its baseline (and the baseline against the base branch's)
        run: node base/tests/ci/design-guard.mjs --root pr --base base/tests/ci/design-guard-baseline.txt
